<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Indonesia Sales News</title>
<style>
:root{--bg:#fff;--bg2:#f3f4f6;--tx:#14151a;--mu:#6b7280;--ln:#e5e7eb;--ac:#2f5bff;--fs:15px}
:root[data-t=dark]{--bg:#131314;--bg2:#1c1d20;--tx:#f2f2f2;--mu:#9aa0a6;--ln:#2e2f33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;padding:20px 18px}
.brand{color:var(--ac);font-weight:700;font-size:.85em}
h1{font-size:1.9em;margin:.2em 0 .1em;line-height:1.2}
.mu{color:var(--mu);font-size:.9em}
.top{display:flex;justify-content:space-between;align-items:center}
button,select{font:inherit;color:inherit;background:none;border:1px solid var(--ln);border-radius:999px;padding:6px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=search]{width:100%;margin:14px 0;padding:12px 16px;border-radius:14px;border:0;background:var(--bg2);color:var(--tx);font:inherit}
hr{border:0;border-top:1px solid var(--ln);margin:18px 0}
h2{font-size:.95em;color:var(--mu);margin:22px 0 10px}
.sig{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--ln)}
.sig b.n{font-size:1.8em;color:var(--ac);line-height:1}
.sig a,.it a.t{color:inherit;text-decoration:none;font-weight:700}
.sig a{font-size:1.1em}
.tag{font-weight:600;font-size:.88em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;background:var(--bg2);padding:14px 16px;border-radius:12px}
.grid div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chips button.on{background:var(--bg2);font-weight:700;border-color:var(--ac)}
.it{display:flex;gap:10px;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--ln)}
.it a.t{display:block;margin-top:2px}
.card{border:1px solid var(--ln);background:var(--bg2);border-radius:14px;padding:14px;margin:12px 0}
.card .row{display:flex;justify-content:space-between;gap:8px}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .pri{flex:1;background:var(--ac);color:#fff;border-color:var(--ac);padding:11px;border-radius:10px}
.btns a{padding:11px 14px;border:1px solid var(--ln);border-radius:10px;color:inherit;text-decoration:none}
.bm{padding:4px 9px;border:0;color:var(--mu)} .bm.on{color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg2);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;padding:12px 0;color:var(--mu)} nav button.on{color:var(--ac);font-weight:700}
.sw{display:flex;gap:12px}.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid var(--ln)}.sw i.on{border-color:var(--tx)}
.seg{display:flex}.seg button{flex:1;border-radius:0}.seg button:first-child{border-radius:12px 0 0 12px}.seg button:last-child{border-radius:0 12px 12px 0}.seg .on{background:var(--bg2);font-weight:700}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T={
ko:{name:"인도네시아 영업뉴스",tabs:["오늘","리드","저장","설정"],new24:n=>`최근 24시간 새 소식 ${n}건`,upd:"업데이트",search:"회사·지역·품목 검색",
 top:"오늘의 핵심 영업 신호",browse:"분야별 보기",latest:"최신 소식",p:["24시간","3일","7일","14일"],all:"전국",src:"원문",
 leads:"프로젝트 리드",leadsub:"공장 신설·증설 소식을 진행 단계별로",allc:"전체",byDate:"최신순",byAmt:"금액순",next:"다음 할 일",save:"리드 저장",
 saved:"저장",none:"미완료 없음",hint:"기사 오른쪽 북마크를 누르면 여기에 저장됩니다.",st:["확인 필요","진행 중","완료"],
 set:"설정",lang:"언어",theme:"화면 모드",th:["기기 설정","라이트","다크"],fs:"글자 크기",ac:"강조 색상",
 note:"제목은 자동 번역이며, 분야·단계는 키워드 규칙으로 분류합니다. 중요한 건은 원문을 확인하세요.",empty:"표시할 소식이 없습니다. 데이터가 아직 수집되지 않았을 수 있습니다.",
 ago:(h)=>h<1?"방금":h<24?`${h}시간 전`:`${Math.floor(h/24)}일 전`},
en:{name:"Indonesia Sales News",tabs:["Today","Leads","Saved","Settings"],new24:n=>`${n} new in the last 24h`,upd:"updated",search:"Company, region, product",
 top:"Top signals for sales",browse:"Browse by topic",latest:"Latest",p:["24h","3d","7d","14d"],all:"All",src:"Source",
 leads:"Project leads",leadsub:"New and expanding plants by stage",allc:"All",byDate:"Newest",byAmt:"Amount",next:"Next step",save:"Save lead",
 saved:"Saved",none:"Nothing open",hint:"Tap the bookmark on an article to save it here.",st:["To check","In progress","Done"],
 set:"Settings",lang:"Language",theme:"Appearance",th:["System","Light","Dark"],fs:"Text size",ac:"Accent color",
 note:"Titles are machine-translated; topics and stages come from keyword rules. Check the source for anything important.",empty:"Nothing to show yet. Data may not have been collected.",
 ago:(h)=>h<1?"now":h<24?`${h}h ago`:`${Math.floor(h/24)}d ago`}};
const TOP={invest:["투자·공장","Investment"],trade:["수출입","Trade"],law:["법령·제도","Regulation"],industry:["산업 동향","Industry"],tariff:["관세·통상","Tariffs"],logistics:["물류·운송","Logistics"],consumer:["소비·유통","Consumer"]};
const TC={invest:"#f0a050",tariff:"#f08a8a",logistics:"#5fd0c0",trade:"#7aa7ff",law:"#c39bff",industry:"#9aa0a6",consumer:"#e6c35a"};
const STG={plan:["계획·MOU","Planned"],permit:["인허가","Permit"],build:["착공","Construction"],open:["가동·준공","Operating"]};
const REG={sumatra:["수마트라","Sumatra"],java:["자바","Java"],kalimantan:["칼리만탄","Kalimantan"],sulawesi:["술라웨시","Sulawesi"],other:["기타 도서","Other islands"]};
const NEXT={build:["설비·건자재 수입 시작 — 프로젝트 화물 제안 시점","Equipment imports begin — pitch project cargo"],plan:["프로젝트 초기 — 담당자 파악·관계 구축","Early stage — identify contacts"],permit:["인허가 단계 — 사전 접촉·견적 준비","Permitting — prepare early quotes"],open:["가동 개시 — 원부자재·수출 물류 제안","Operating — pitch inbound and export logistics"],
 logistics:["운임·항만·인프라 변화 — 서비스·견적 점검","Rates and ports changing — review quotes"],tariff:["고객 원가·원산지 영향 — 통관·대체 루트 제안","Cost and origin impact — pitch customs and routes"],
 trade:["수출입 흐름 변화 — 고객 물량 점검","Trade flow shift — check client volumes"],law:["규제 변경 — 고객 영향 확인·안내","Rule change — brief clients"],industry:["산업 동향 — 고객 접점 파악","Industry move — find contacts"],consumer:["소비·유통 변화 — 유통 고객 접점","Retail shift — approach distributors"]};
const COL=["#2f5bff","#2a9d8f","#64748b","#e5484d"];
let N=40,D=[],UPD="",tab=0,S=JSON.parse(localStorage.getItem("idn")||"{}");
S={lang:"ko",theme:0,fs:15,ac:0,saved:{},per:1,reg:"",topic:"",stage:"",sort:0,sf:"all",q:"",...S};
let li=S.lang==="ko"?0:1;const L=()=>T[S.lang];
const save=()=>localStorage.setItem("idn",JSON.stringify(S));
const hrs=i=>Math.max(0,Math.round((Date.now()-new Date(i.published))/36e5));
const TC2=(()=>{try{return JSON.parse(localStorage.getItem("idn_tr")||"{}")}catch(_){return{}}})(),VIS=new Set(),FAIL=new Set();let busy=false;
const ti=i=>{VIS.add(i);return TC2[i.id+S.lang]||(S.lang==="ko"?i.title_ko:i.title_en)||i.title};
async function kick(){
 if(busy)return;const lg=S.lang,q=[...VIS].filter(i=>!TC2[i.id+lg]&&!FAIL.has(i.id+lg)&&!(lg==="en"&&i.lang==="en"));
 if(!q.length)return;busy=true;let n=0;
 for(let k=0;k<q.length&&k<90;k+=3){await Promise.all(q.slice(k,k+3).map(async i=>{
  try{const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=${i.lang}&tl=${lg}&q=${encodeURIComponent(i.title)}`);
   const t=(await r.json())[0].map(x=>x[0]).join("");if(t){TC2[i.id+lg]=t;n++}else FAIL.add(i.id+lg)}catch(_){FAIL.add(i.id+lg)}}))}
 busy=false;
 if(n){try{localStorage.setItem("idn_tr",JSON.stringify(TC2))}catch(_){}if(document.activeElement?.id!=="q")render()}}
const usd=n=>n>=1e9?`$${(n/1e9).toFixed(2).replace(/\.?0+$/,"")}B`:`$${Math.round(n/1e6)}M`;
function theme(){const d=S.theme==2||(S.theme==0&&matchMedia("(prefers-color-scheme:dark)").matches);const r=document.documentElement;r.dataset.t=d?"dark":"light";r.style.setProperty("--ac",COL[S.ac]);r.style.setProperty("--fs",S.fs+"px");r.lang=S.lang}
function bm(i){const on=S.saved[i.id];return `<button class="bm ${on?"on":""}" data-bm="${i.id}" aria-label="bookmark">${on?"★":"☆"}</button>`}
function row(i){return `<div class="it"><div><span class="tag" style="color:${TC[i.topic]}">${TOP[i.topic][li]}</span> <span class="mu">· ${esc(i.source)} · ${L().ago(hrs(i))}${i.usd?" · "+usd(i.usd):""} · <a href="${esc(i.url)}" target="_blank" rel="noopener" style="color:inherit">${L().src}</a></span><a class="t" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(ti(i))}</a></div>${bm(i)}</div>`}
function score(i){const w={invest:3,tariff:2.5,logistics:2,trade:1.5,law:1.5}[i.topic]||1,s={build:2,open:1.5,permit:1,plan:.5}[i.stage]||0;return w+s+(i.usd?1:0)-hrs(i)/24}
function match(i){const q=S.q.trim().toLowerCase();return !q||[i.title,i.title_ko,i.title_en,i.source,i.sector].join(" ").toLowerCase().includes(q)}
const MORE=`<div id="more" class="mu" style="text-align:center;padding:24px">···</div>`;
const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){const y=scrollY;N+=40;render();scrollTo(0,y)}},{rootMargin:"600px"});
function today(){
 const day=D.filter(match),n24=D.filter(i=>hrs(i)<24).length;
 const top=[],used=new Set();[...day].filter(i=>hrs(i)<72).sort((a,b)=>score(b)-score(a)).forEach(i=>{if(top.length<3&&!used.has(i.topic)){top.push(i);used.add(i.topic)}});
 const cnt=k=>day.filter(i=>i.topic===k).length,lim=[24,72,168,336][S.per];
 const list=day.filter(i=>hrs(i)<=lim&&(!S.reg||i.region===S.reg)&&(!S.topic||i.topic===S.topic));
 const d=UPD?new Date(UPD):new Date();
 return `<div class="top"><span class="brand">${L().name}</span><button id="rf" aria-label="reload">↻</button></div>
 <h1>${d.toLocaleDateString(S.lang==="ko"?"ko-KR":"en-GB",{month:"long",day:"numeric",weekday:"long"})}</h1>
 <div class="mu">${L().new24(n24)} · ${L().upd} ${UPD?d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"-"}</div>
 <input type="search" id="q" value="${esc(S.q)}" placeholder="${L().search}"><hr>
 <h2>${L().top}</h2>${top.map((i,k)=>`<div class="sig"><b class="n">${k+1}</b><div><span class="tag" style="color:${TC[i.topic]}">${TOP[i.topic][li]}${i.stage?" · "+STG[i.stage][li]:""}</span><br><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(ti(i))}</a><div class="mu">${NEXT[i.stage||i.topic][li]}</div></div></div>`).join("")||`<p class="mu">${L().empty}</p>`}
 <h2>${L().browse}</h2><div class="grid">${Object.keys(TOP).map(k=>`<div data-tp="${k}" style="${S.topic===k?"font-weight:700;color:var(--ac)":""}"><span>${TOP[k][li]}</span><b>${cnt(k)}</b></div>`).join("")}<div data-tab="2"><span style="color:var(--ac)">${L().saved}</span><b style="color:var(--ac)">${Object.keys(S.saved).length}</b></div></div>
 <h2>${L().latest}</h2><div class="chips">${L().p.map((p,k)=>`<button data-per="${k}" class="${S.per==k?"on":""}">${p}</button>`).join("")}</div>
 <div class="chips"><button data-reg="" class="${!S.reg?"on":""}">${L().all}</button>${Object.keys(REG).map(k=>`<button data-reg="${k}" class="${S.reg===k?"on":""}">${REG[k][li]}</button>`).join("")}</div>
 ${list.slice(0,N).map(row).join("")||`<p class="mu">${L().empty}</p>`}${list.length>N?MORE:""}`}
function leads(){
 const all=D.filter(i=>i.stage&&match(i)),c=k=>all.filter(i=>i.stage===k).length;
 let l=all.filter(i=>!S.stage||i.stage===S.stage);l=S.sort?l.sort((a,b)=>(b.usd||0)-(a.usd||0)):l;
 return `<span class="brand">${L().name}</span><h1>${L().leads}</h1><div class="mu">${L().leadsub}</div><hr>
 <div class="chips"><button data-st="" class="${!S.stage?"on":""}">${L().allc} ${all.length}</button>${Object.keys(STG).map(k=>`<button data-st="${k}" class="${S.stage===k?"on":""}">${STG[k][li]} ${c(k)}</button>`).join("")}</div>
 <div class="chips"><button data-sort="0" class="${!S.sort?"on":""}">${L().byDate}</button><button data-sort="1" class="${S.sort?"on":""}">${L().byAmt}</button></div>
 ${l.slice(0,N).map(i=>`<div class="card"><div class="row"><span class="mu">${L().ago(hrs(i))}${i.region?" · "+REG[i.region][li]:""}</span><b>${i.usd?usd(i.usd):""}</b></div><div style="font-weight:700;margin:6px 0">${esc(ti(i))}</div><span class="tag" style="color:${TC.invest}">${STG[i.stage][li]}</span> <span class="mu">${i.sector||""}</span><div class="mu"><b style="color:var(--ac)">${L().next}</b> · ${NEXT[i.stage][li]}</div><div class="btns"><button class="pri" data-bm="${i.id}">${S.saved[i.id]?"★ ":""}${L().save}</button><a href="${esc(i.url)}" target="_blank" rel="noopener">${L().src}</a></div></div>`).join("")||`<p class="mu">${L().empty}</p>`}${l.length>N?MORE:""}`}
function savedv(){
 const e=Object.values(S.saved),f=e.filter(x=>S.sf==="all"||x.st==S.sf),open=e.filter(x=>x.st!=2).length;
 return `<span class="brand">${L().name}</span><h1>${L().saved}</h1><div class="mu">${open?open:L().none}</div><hr>
 <div class="seg"><button data-sf="all" class="${S.sf==="all"?"on":""}">${L().allc}</button>${L().st.map((s,k)=>`<button data-sf="${k}" class="${S.sf==k?"on":""}">${s}</button>`).join("")}</div>
 ${f.map(x=>row(x.it).replace(/<button class="bm.*<\/button>/,`<select data-ss="${x.it.id}">${L().st.map((s,k)=>`<option value="${k}" ${x.st==k?"selected":""}>${s}</option>`).join("")}</select>`)).join("")||`<p class="mu" style="text-align:center;margin-top:40px">${L().hint}</p>`}`}
function sett(){const seg=(a,cur,key)=>`<div class="seg">${a.map(([v,t])=>`<button data-${key}="${v}" class="${cur==v?"on":""}">${t}</button>`).join("")}</div>`;
 return `<span class="brand">${L().name}</span><h1>${L().set}</h1><hr>
 <h2>${L().lang}</h2>${seg([["en","English"],["ko","한국어"]],S.lang,"lg")}
 <h2>${L().theme}</h2>${seg(L().th.map((t,k)=>[k,t]),S.theme,"th")}
 <h2>${L().fs}</h2><div style="display:flex;gap:12px;align-items:center"><button data-fs="-1">A−</button><input type="range" id="fs" min="12" max="20" value="${S.fs}" style="flex:1"><button data-fs="1">A+</button><b>${S.fs}px</b></div>
 <h2>${L().ac}</h2><div class="sw">${COL.map((c,k)=>`<i data-ac="${k}" class="${S.ac==k?"on":""}" style="background:${c}"></i>`).join("")}</div><hr><p class="mu">${L().note}</p>`}
function render(){VIS.clear();li=S.lang==="ko"?0:1;theme();$("#app").innerHTML=[today,leads,savedv,sett][tab]();$("#nav").innerHTML=L().tabs.map((t,k)=>`<button data-tab="${k}" class="${tab===k?"on":""}">${t}</button>`).join("");const q=$("#q");if(q)q.oninput=e=>{S.q=e.target.value;N=40;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};const m=$("#more");if(m)io.observe(m);kick()}
document.addEventListener("click",e=>{const g=k=>{const t=e.target.closest(`[data-${k}]`);return t?t.dataset[k]:null};let v;
 if((v=g("tab"))!==null){tab=+v;N=40}
 else if((v=g("bm"))!==null){const it=D.find(i=>i.id===v)||(S.saved[v]||{}).it;if(S.saved[v])delete S.saved[v];else S.saved[v]={it,st:0}}
 else if((v=g("per"))!==null){S.per=+v;N=40}
 else if((v=g("reg"))!==null){S.reg=v;N=40}
 else if((v=g("tp"))!==null){S.topic=S.topic===v?"":v;N=40}
 else if((v=g("st"))!==null){S.stage=v;N=40}
 else if((v=g("sort"))!==null){S.sort=+v;N=40}
 else if((v=g("sf"))!==null)S.sf=v==="all"?v:+v;
 else if((v=g("lg"))!==null)S.lang=v;
 else if((v=g("th"))!==null)S.theme=+v;
 else if((v=g("ac"))!==null)S.ac=+v;
 else if((v=g("fs"))!==null)S.fs=Math.min(20,Math.max(12,S.fs+ +v));
 else if(e.target.closest("#rf"))return load();
 else return;
 save();render()});
document.addEventListener("input",e=>{if(e.target.id==="fs"){S.fs=+e.target.value;save();render()}});
document.addEventListener("change",e=>{const id=e.target.dataset.ss;if(id){S.saved[id].st=+e.target.value;save();render()}});
async function load(){try{const j=await(await fetch("data/news.json?"+Date.now())).json();D=j.items;UPD=j.updated}catch(_){D=[]}render()}
load();
</script></body></html>
